version: "3.9"

services:
  redis:
    image: redis:8.4-alpine
    container_name: redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data    # persistence between container restarts
    restart: unless-stopped

  backend:
    build:
      context: ../Backend
      dockerfile: Dockerfile
    container_name: tictactoe-backend
    ports:
      - "8080:8080"
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
