name: Frontend

on:
  push:
    branches: [ "master" ]
    paths:
      - 'Front/**'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'Front/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: cd Front && npm install